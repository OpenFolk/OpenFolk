name: Backend image

# Publishes the backend image (a machine that never sleeps) to the GitHub Container Registry, with the same
# tags as the relay image: "edge" and the commit SHA from main, "latest" plus the version from tags like v1.2.3.
# On top of it the variant with voice messages (local/Dockerfile.voice), every tag with "-voice".
# Pull requests only build the backend image.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['desktop/**', 'mobile/**', 'relay/**', 'webapp/**', 'docs/**', '**/*.md']
  pull_request:
    paths: ['local/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/local-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io only accepts lower case (OpenFolk/OpenFolk -> ghcr.io/openfolk/openfolk-local)
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-local" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: local/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The variant with voice messages, built on the image just pushed (by digest, so both are the same build)
      - id: meta-voice
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
            suffix=-voice,onlatest=true
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: local/Dockerfile.voice
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          tags: ${{ steps.meta-voice.outputs.tags }}
          labels: ${{ steps.meta-voice.outputs.labels }}
          cache-from: type=gha,scope=voice
          cache-to: type=gha,mode=max,scope=voice
