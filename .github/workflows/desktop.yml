name: Desktop apps

# Builds the desktop app on each system it ships for (npm installs the Claude Code binary of the system it runs on, so
# every app is bundled on its own runner), runs the smoke test against the built app and keeps the packages as
# workflow artifacts. A published release gets them attached as assets, with the update feeds (latest*.yml, blockmaps)
# the installed apps update from, plus SHA256SUMS; openfolk.app links to the latest release, so a release is the only
# manual step. Signing switches itself on per system once its secrets exist (desktop/README.md, "Signing").
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'local/**', 'relay/**', 'shared/**', 'webapp/**', 'scripts/desktop-*.mjs', 'package-lock.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'scripts/desktop-*.mjs', '.github/workflows/desktop.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # A release build is never cancelled by a later push
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: --win
            exe: desktop/dist/win-unpacked/OpenFolk.exe
            files: |
              desktop/dist/*.exe
              desktop/dist/*.blockmap
              desktop/dist/latest.yml
          - os: macos
            # Apple Silicon; the arm64 DMG is what openfolk.app offers for macOS
            runner: macos-latest
            target: --mac --arm64
            exe: desktop/dist/mac-arm64/OpenFolk.app/Contents/MacOS/OpenFolk
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
              desktop/dist/*.blockmap
              desktop/dist/latest-mac.yml
          - os: linux
            runner: ubuntu-latest
            target: --linux
            exe: desktop/dist/linux-unpacked/openfolk
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.runner }}
    # Azure trusts this repository's OIDC token only in the environment "release" (federated credential), so only
    # the Windows build of a published release can sign; pushes and pull requests never reach Azure
    environment: ${{ matrix.os == 'windows' && github.event_name == 'release' && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # Playwright for the smoke test comes from the root, Electron and electron-builder from desktop/
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run bundle --prefix desktop
      # The certificate profile exists only after Microsoft has validated the company; until then Windows stays unsigned
      - name: Sign in to Azure (Windows release)
        if: matrix.os == 'windows' && github.event_name == 'release' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Fetch the signing token
        if: matrix.os == 'windows' && github.event_name == 'release' && vars.AZURE_SIGNING_PROFILE != ''
        # The GitHub token behind the sign-in expires within minutes, the access token after about an hour; fetched
        # now, the Azure CLI hands it from its cache to Invoke-TrustedSigning when electron-builder signs much later
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      - name: Build
        working-directory: desktop
        # Each system sees only its own secrets; an empty one means "not set up", and that system builds unsigned
        env:
          MAC_CERTIFICATE_P12: ${{ matrix.os == 'macos' && secrets.MAC_CERTIFICATE_P12 || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          # Invoke-TrustedSigning takes the Azure CLI sign-in of the step above; no client secret exists
          AZURE_SIGN: ${{ matrix.os == 'windows' && github.event_name == 'release' && vars.AZURE_SIGNING_PROFILE != '' }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        # Without --publish never electron-builder uploads on its own when it sees a tag; the publish setting in
        # package.json only makes it write the update feeds
        run: |
          args=(${{ matrix.target }} --publish never)
          if [ -n "$MAC_CERTIFICATE_P12" ]; then
            # Developer ID Application certificate as base64 .p12; electron-builder imports it into a temporary keychain
            export CSC_LINK="$MAC_CERTIFICATE_P12" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            if [ -n "$APPLE_API_KEY_P8" ]; then
              # Notarization starts by itself once APPLE_API_KEY (a file), APPLE_API_KEY_ID and APPLE_API_ISSUER are set
              key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              printf '%s' "$APPLE_API_KEY_P8" > "$key"
              export APPLE_API_KEY="$key"
              echo "macOS: signed and notarized"
            else
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
              echo "macOS: signed, not notarized (APPLE_API_KEY_P8 missing)"
            fi
          else
            # Never a certificate from the runner's keychain
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [ "$AZURE_SIGN" = "true" ]; then
            args+=("-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
                   "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
                   "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
                   "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER")
            echo "Windows: signed with Azure Trusted Signing"
          fi
          npx electron-builder "${args[@]}"

      - name: Smoke test (Linux)
        if: matrix.os == 'linux'
        # Ubuntu 24.04 forbids unprivileged user namespaces, which Chromium's sandbox needs
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum node scripts/desktop-smoke.mjs --exe ${{ matrix.exe }}
      - name: Smoke test
        if: matrix.os != 'linux'
        run: node scripts/desktop-smoke.mjs --exe "${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: openfolk-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ matrix.files }}
        # GitHub turns spaces in asset names into dots ("OpenFolk Setup 0.1.0.exe" -> "OpenFolk.Setup.0.1.0.exe")
        # One pattern per line; only the glob expands, so file names with spaces stay whole
        run: |
          shopt -s nullglob
          files=()
          while IFS= read -r pattern; do [ -n "$pattern" ] && files+=($pattern); done <<< "$FILES"
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber

  checksums:
    # One SHA256SUMS over every desktop package of the release, once all three systems have uploaded
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.dmg' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.deb'
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "$TAG" ../SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
