<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
<title data-i18n="foldersTitle">Allowed folders</title>
<link rel="stylesheet" href="folders-ui.css">
<style>
    :root { color-scheme: light dark; --bg: #111b21; --card: #202c33; --text: #e9edef; --muted: #8696a0; --border: #3b4a54; --accent: #00a884; --error: #f15c6d; }
    @media (prefers-color-scheme: light) { :root { --bg: #f0f2f5; --card: #fff; --text: #111b21; --muted: #667781; --border: #d1d7db; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { padding: 22px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0 0 14px; color: var(--muted); }
    button { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: default; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .warn { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--error); background: rgba(241, 92, 109, .12); color: var(--text); font-size: 13px; }
    .error { color: var(--error); min-height: 1.5em; margin: 8px 0 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    #status { margin: 12px 0 0; color: var(--text); font-size: 13px; }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
    <h1 data-i18n="foldersTitle">Allowed folders</h1>
    <p data-i18n="foldersIntro">Bots only work in these folders and below them.</p>
    <div id="folders"></div>
    <div class="actions">
        <button type="button" id="save" data-i18n="foldersSave">Save</button>
        <button type="button" class="secondary" id="close" data-i18n="foldersClose">Close</button>
    </div>
    <p id="status"></p>
</main>
<script src="folders-ui.js"></script>
<script src="folders.js"></script>
</body>
</html>
